# Cooprinsem POS — demo en el servidor Linux (ADR-049).
# Lo instala instalar-root.sh en /etc/nginx/sites-available/cooprinsem-pos.
# Frontend compilado + /api y /health reenviados al backend en 127.0.0.1:3101.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/cooprinsem-pos/current/dist;
    index index.html;

    # Margen para JSON grandes (pedidos con muchas posiciones)
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Archivos con hash en el nombre: caché larga (cada versión trae nombres nuevos)
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El folio de la factura espera hasta 90 s a SAP (ADR-033)
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3101;
    }

    # Aplicación de una página: cualquier ruta (/pedidos/nuevo, /caja...) carga index.html.
    # index.html sin caché: el navegador toma cada versión nueva sin Ctrl+F5.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
